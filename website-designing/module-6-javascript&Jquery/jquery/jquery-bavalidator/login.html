<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Login Page</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="css/gray.css">
    <!-- jquery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <!-- jquery bvalidator plugin via jquery  -->
    <script src="js/jquery.bvalidator.js"></script>
    <script src="js/default.min.js"></script>
    <script src="js/gray.js"></script>

    <!-- jquery bvalidator here -->
     <script>
        $(document).ready(function(){
            $("#frm").bValidator();
        })
     </script>
  
</head>
<body>

    <div class="container w-50 mx-auto mt-5 p-5">
        <h1>Register Page</h1>
        <hr class="w-25" />
        <form method="post" action="welcome.html" id="frm">
            <div class="form-group mt-2">
                <input type="text" placeholder="Name *" data-bvalidator="required,alpha" class="form-control">
            </div>
            
            <div class="form-group mt-2">
                <input type="text" placeholder="Email *" data-bvalidator="required,email" class="form-control">
            </div>
            
            <div class="form-group mt-2">
                <input type="password" placeholder="Password *" data-bvalidator="required,minlen[3],maxlen[10]" class="form-control">
            </div>
            
            <div class="form-group mt-2">
                <input type="password" placeholder="Confirmed Password *" data-bvalidator="required,minlen[3],maxlen[10]" class="form-control">
            </div>

            
            <div class="form-group mt-2">
                <input type="text" placeholder="Phone *" data-bvalidator="required,minlen[10],maxlen[10],digit" class="form-control">
            </div>

            
            <div class="form-group mt-2">
                <textarea  placeholder="Address *" data-bvalidator="required" class="form-control"></textarea>
            </div>

            
            <div class="form-group mt-2">
                <input type="submit" value="Register" class="btn btn-lg btn-primary text-white">
            </div>
        </form>
    </div>

    
</body>
</html>
