<script>
//list of string function 
    const stringFunctions = [
        {
            name: "length",
            description: "Returns the length of the string.",
            example: `"Hello".length // Output: 5`
        },
        {
            name: "toUpperCase()",
            description: "Converts the string to uppercase letters.",
            example: `"hello".toUpperCase() // Output: "HELLO"`
        },
        {
            name: "toLowerCase()",
            description: "Converts the string to lowercase letters.",
            example: `"HELLO".toLowerCase() // Output: "hello"`
        },
        {
            name: "charAt()",
            description: "Returns the character at a specified index.",
            example: `"Hello".charAt(1) // Output: "e"`
        },
        {
            name: "substring()",
            description: "Extracts a portion of the string between two indices.",
            example: `"Hello, World!".substring(0, 5) // Output: "Hello"`
        },
        {
            name: "indexOf()",
            description: "Returns the index of the first occurrence of a specified value.",
            example: `"Hello, World!".indexOf("World") // Output: 7`
        },
        {
            name: "replace()",
            description: "Replaces a specified value with another value in the string.",
            example: `"Hello, World!".replace("World", "Everyone") // Output: "Hello, Everyone!"`
        },
        {
            name: "split()",
            description: "Splits the string into an array of substrings based on a specified separator.",
            example: `"Hello, World!".split(", ") // Output: ["Hello", "World!"]`
        }

        
    ];

    console.log(stringFunctions);

</script>
