<!DOCTYPE html>
<html>
<head>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>

</head>
<body>
<div class="app  w-50 mx-auto mt-5 p-5">
<form name="frm" id="frm" action="welcome.html" onsubmit="return validation(this.value)">    
<div class="mb-3">
<label for="exampleFormControlInput1" class="form-label">Email address</label>
<input type="text" name="fname" class="form-control" id="exampleFormControlInput1" placeholder="FirstName">
</div>
<div class="mb-3">
<label for="exampleFormControlInput1" class="form-label">Email address</label>
<input type="text" name="lname" class="form-control" id="exampleFormControlInput1" placeholder="LastName">
</div>

<div class="mb-3">
<label for="exampleFormControlInput1" class="form-label">Email address</label>
<input type="text" name="email" class="form-control" id="exampleFormControlInput1" placeholder="Email">
</div>

<div class="mb-3">
<label for="exampleFormControlTextarea1" class="form-label">Example textarea</label>
<textarea class="form-control" name="address" id="exampleFormControlTextarea1" rows="3"></textarea>
</div>

<div class="mb-3">
<input type="submit" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com" value="Submit">
</div>
</form>
</div>
</body>
