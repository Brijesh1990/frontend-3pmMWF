    An object is a collection of properties, and a property is an association between a name (or key) and a value. In JavaScript, objects are used to store various keyed collections and more complex entities. Objects can contain primitive values, other objects, and functions as properties.

    const person = {
        firstName: "John",
        lastName: "Doe",
        age: 30,
        greet: function() {

        }
