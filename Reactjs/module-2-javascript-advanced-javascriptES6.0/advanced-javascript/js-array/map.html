<script>
    let employee=["raj","vijay","ajay","sanjay"];
    //map method to convert all names to uppercase
    let result=employee.map(function(emp){
        return emp.toUpperCase();
    });
    console.log(result);
    // [RAJ, VIJAY, AJAY, SANJAY]

    let num=[2,3,4,5,6];
    //map method to square of each number
    let squared=num.map(function(n){
        return n*n;
    });
    console.log(squared);
    // [4, 9, 16, 25, 36]

   //map method to find the first element that is greater than 4
   let found=squared.find(function(n){
       return n>4;
   });
   console.log(found);
   // 9
</script>
