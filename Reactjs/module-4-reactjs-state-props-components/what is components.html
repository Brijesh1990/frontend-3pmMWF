what is components  ?

components are reusable.
components are saved inside of react js via .js or .jsx files.
components can be functional or class-based. 
components are two types : functional components and class components.
functional components are simple javascript functions that return jsx.

class components are es6 classes that extend from react.component and have a render method that returns jsx.

Note : react js recommends using functional components with hooks for most use cases and for api.

Note : class components are still supported but are less commonly used in modern react development.

class components does not support hooks.

components is small pieces of code that can be reused throughout your application to build user interfaces in a modular way.

small peaces of code that return react elements there we used components.

components help in breaking down complex data into smaller, manageable parts, making it easier to develop, maintain, and reuse code one components to another.


  types of components :
    1. functional components
    2. class components
